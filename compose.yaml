services:
  app:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    # Doc bien moi truong tu .env cua HOST luc chay, thay vi nuong vao image.
    #
    # Bat buoc phai co ke tu khi `.env` duoc dua vao .dockerignore. Do duoc
    # truoc khi sua: `COPY . .` o builder keo .env vao, `next build` chep no
    # sang .next/standalone/.env, va runner copy nguyen thu muc do — nen
    # GOOGLE_GENERATIVE_AI_API_KEY nam san trong layer cua image.
    #
    # CHATBOT_INTERNAL_SECRET phai co trong file nay, va job hang tuan chay
    # tren host phai dung DUNG gia tri do; lech nhau thi pha B an 401 moi lo.
    env_file:
      - .env
    environment:
      # LOI THU HAI CHI XUAT HIEN TRONG CONTAINER.
      #
      # `.env` cua may dev ghi DATABASE_URI=mongodb://localhost:27017/bkft —
      # dung tren may dev, SAI trong container: `localhost` o day la chinh
      # container app, khong phai Mongo. Quan sat truc tiep khi chay container
      # that: `connect ECONNREFUSED 127.0.0.1:27017`, va app phai roi xuong che
      # do suy giam — van tra loi duoc nhung MAT SACH lich su hoi thoai, tuc moi
      # cau hoi noi tiep ("khoa do hoc bao lau?") deu truot chu de.
      #
      # `environment:` DE LEN `env_file:` trong docker compose, nen dong nay
      # ghim container luon noi toi service `db` bat ke .env cua may nao. Do la
      # cho dung: mot .env dung chung cho ca chay local lan chay container thi
      # khong the dung ca hai, va thu phai dung theo container nam o day.
      #
      # Ten `db` la ten service ben duoi; mang cua compose tu phan giai no
      # (do duoc trong container: db -> 172.18.0.2).
      DATABASE_URI: mongodb://db:27017/bkft
      # LOI THU NHAT CHI XUAT HIEN TRONG CONTAINER — xem EMBED_CACHE_DIR trong config.ts.
      #
      # Mac dinh cua @xenova/transformers la cat model trong
      # node_modules/@xenova/transformers/.cache. Do duoc: 560MB tren may dev,
      # va 0 byte trong .next/standalone — tuc thu muc do trong image la RONG,
      # vi Dockerfile chi chep .next/standalone vao image chay.
      #
      # Khong co dong nay thi container phai tai ~560MB tu huggingface.co o lan
      # chay dau, LAI TU DAU sau moi `docker compose up -d --build`. May chu
      # chan egress hoac mang cham -> preload that bai -> chatbot chet trong khi
      # website van xanh. Local khong bao gio thay vi local luon co san cache.
      CHATBOT_MODEL_CACHE: /app/model-cache
    volumes:
      - "/home/hust/bkfintech/media:/app/public/media"
      # Cache model, gan tu host. Tao truoc khi chay lan dau:
      #   mkdir -p /home/hust/bkfintech/model-cache
      # De trong thi lan chay dau tu tai model ve day (can egress toi
      # huggingface.co MOT lan). Muon khoi tai, chep san tu mot may da co:
      #   scp -r <may-dev>/node_modules/@xenova/transformers/.cache/* \
      #          hust@<may-chu>:/home/hust/bkfintech/model-cache/
      - "/home/hust/bkfintech/model-cache:/app/model-cache"
      # Chỉ mục chatbot. Dockerfile KHÔNG copy data/ vào image (runner chỉ lấy
      # public + .next), nên không có mount này thì INDEX_DIR ở config.ts —
      # `${process.cwd()}/data/faiss_index_js` — trỏ vào thư mục không tồn tại và
      # VectorStore.load() chết ngay lần đầu có người hỏi. Mount cũng là thứ giữ
      # cho store.json do job cập nhật hàng tuần sinh ra sống sót qua mỗi lần
      # rebuild image, thay vì bị ghi đè bởi bản nằm trong image.
      #
      # :ro vì tiến trình web chỉ ĐỌC store.json (vectorStore.ts, diacritics.ts) —
      # không có một lệnh ghi nào vào data/ trong toàn bộ src/. Phía ghi là
      # scripts/build-index.ts, chạy ngoài container này.
      #
      # Thư mục host phải được seed sẵn bằng data/faiss_index_js/store.json
      # trước lần khởi động đầu tiên.
      - "/home/hust/bkfintech/data:/app/data:ro"
    ports:
      - "3003:3000"
    # Mục 6.5 — trần RAM tường minh cho cả hai service.
    #
    # Không đặt thì mỗi bên tự phình cho tới khi OOM killer của kernel chọn nạn
    # nhân, mà nó rất có thể chọn một dịch vụ khác của viện chứ không phải thủ
    # phạm.
    #
    # 4G, KHÔNG còn 2560m. Con số cũ tính cho một thế giới không còn nữa: nó giả
    # định "trong cửa sổ bảo trì app bỏ preload nên chỉ dùng ~0,4G, nhường chỗ
    # cho job". Bây giờ app GIỮ model suốt và job mượn lại qua
    # /api/chatbot/embed, nên app không bao giờ xuống 0,4G nữa.
    #
    # ĐO BẰNG `docker stats` TRONG CONTAINER LINUX THẬT, không còn suy từ
    # Windows nữa (bản trước ghi hoãn việc này lại):
    #
    #   Lần chạy có cache model nạp sẵn (quy trình đúng):
    #     nghỉ ngay sau preload, chưa ai hỏi      2,661 GiB
    #     ngay sau một lô embed 128 đoạn          1,484 GiB
    #     preload mất                                8,8 s
    #   Lần chạy đầu với cache RỖNG (phải tải 560MB từ huggingface.co):
    #     ĐỈNH trong lúc tải + nạp model          3,49  GiB   <-- 87% của 4g
    #     ổn định sau đó                          1,714 GiB
    #     preload mất                               80,6 s
    #   db (mongo:4.4.6) nhàn rỗi                    81 MiB
    #
    # HAI LÝ DO KHÔNG ĐƯỢC SIẾT XUỐNG DƯỚI 4g:
    #
    # 1. 2,661 GiB > 2560m — với trần cũ, container bị kernel giết NGAY SAU KHI
    #    KHỞI ĐỘNG, trước cả khi có người hỏi câu nào. memswap_limit BẰNG
    #    mem_limit (swap tắt) nên chạm trần là bị giết chứ không phải chậm đi.
    #
    # 2. Đỉnh 3,49 GiB của đường "cache rỗng" mới là con số quyết định, và hậu
    #    quả khi thiếu chỗ nặng hơn nhiều so với "chatbot chết, website xanh".
    #    Quan sát trực tiếp khi trần nhỏ hơn đỉnh này:
    #      exit=137  oom=true  restarts=1,2,3...
    #      cache tải về được 17MB sau 180 giây
    #    Tiến trình bị giết giữa chừng, `restart: always` cho chạy lại, và mỗi
    #    lần restart VỨT BỎ phần đã tải — nên nó không bao giờ tải xong, chỉ
    #    quay vòng mãi. Mà tiến trình đó cũng chính là tiến trình phục vụ
    #    website, nên lần này CẢ WEBSITE CŨNG CHẾT THEO.
    #
    # Nạp sẵn cache bằng scp (xem chú thích ở volumes bên trên) tránh hẳn đường
    # 3,49 GiB đó — đỉnh chỉ còn 2,7 GiB. Đó là lý do bước scp nằm trong
    # CHECKLIST mục 0 chứ không phải là mẹo cho vui.
    #
    # Phần đệm còn lại là có thật, không phải phòng xa: hot-swap store giữ tạm
    # hai bản (+122MB), mỗi request đồng thời ~0,5MB, và lô embed 128 đoạn
    # trong cửa sổ bảo trì.
    mem_limit: 4g
    memswap_limit: 4g
  db:
    restart: always
    image: mongo:4.4.6
    # WiredTiger mặc định tự lấy 50% của (RAM máy − 1GB) làm cache VÀ KHÔNG TRẢ
    # LẠI. Khai tường minh biến một biến số tự phình thành hằng số kiểm soát được.
    #
    # Nâng 0.5 -> 1 và 1024m -> 2g. Lý do không phải là dư dả: Mongo chập chờn
    # được quan sát trực tiếp trên máy dev — monitor timeout, `serverStatus was
    # very slow` 8 giây, kết nối đầu mất 38 giây — và app đã phải rơi xuống chế
    # độ suy giảm (mất trí nhớ hội thoại) vì nó. Bộ nhớ eo hẹp là một trong
    # những nguyên nhân.
    #
    # Vẫn giữ trần tường minh thay vì bỏ hẳn: mongo:4.4.6 đã hết hạn hỗ trợ từ
    # 02/2024, để nó tự phình trên máy dùng chung là rủi ro không cần thiết.
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - '27026:27017'
    volumes:
      - "/home/hust/bkfintech/db:/data/db"
    logging:
      driver: none
